name: warp-sql-js-release

# On a vX.Y.Z tag: the full suite (ci.yml: lint, typecheck, unit tests on every Node, live
# tests, Deno/Bun/workerd and browser smoke tests) runs on the tagged commit itself, then a
# GitHub Release carries the package tarball and the tag's CHANGELOG section, then npm.
#
# npm publishing is prepared but off. It uses npm trusted publishing (OIDC: no npm token is
# stored anywhere) and runs only when the repository variable NPM_PUBLISH_ENABLED is "true".
# Before turning it on, on npmjs.com: create the @gizmodata/warp-sql package (or publish
# 0.0.0 once by hand), then under its Settings > Trusted publishing add GitHub Actions with
# organization gizmodata, repository warp-sql-js, workflow release.yml, environment npm.
# Create the `npm` environment in this repository (with required reviewers, if wanted).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  github-release:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || { echo "no version in the tag"; exit 1; }
          [ "$(node -p 'require("./package.json").version')" = "$version" ] || { echo "package.json is not $version"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.tgz"
          body_path: release_notes.md

  npm:
    needs: github-release
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm new enough for trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run build
      # restricted: the package stays private to the npm organization. Making it public is a
      # decision for GizmoData, not a default.
      - name: Publish
        env:
          WARP_SQL_JS_RELEASE: "1"
        run: npm publish --access restricted
